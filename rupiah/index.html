<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0f7a5f">
<title>Rupiah Route Check</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: single narrow column — inputs, verdict, three ranked rows */
:root {
  --bg: #f3f5f4; --surface: #ffffff; --fg: #17201d; --muted: #5d6b66;
  --line: #d6dedb; --accent: #0f7a5f; --accent-soft: #e1f2ec; --warn: #a3541a;
  --sans: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121816; --surface: #1b2320; --fg: #e6ece9; --muted: #95a39e;
  --line: #2c3733; --accent: #4cc39f; --accent-soft: #1d3a31; --warn: #e3965c; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121816; --surface: #1b2320; --fg: #e6ece9; --muted: #95a39e;
  --line: #2c3733; --accent: #4cc39f; --accent-soft: #1d3a31; --warn: #e3965c; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--sans); }
.wrap { max-width: 460px; margin: 0 auto; padding-block: 24px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 20px; }
h1 { font-size: 20px; font-weight: 600; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
.fields { display: grid; gap: 12px; }
label { display: grid; gap: 4px; font-size: 12px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
label small { text-transform: none; letter-spacing: 0; font-weight: 400; }
input { font: 500 18px var(--mono); padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface); color: var(--fg); width: 100%; box-sizing: border-box; font-variant-numeric: tabular-nums; }
input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
.verdict { background: var(--accent-soft); border-radius: 10px; padding: 14px 16px; }
.verdict b { display: block; font-size: 17px; }
.verdict span { font-size: 13px; color: var(--muted); }
.rows { display: grid; border-top: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: baseline;
  padding: 10px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.row .name { font-weight: 500; }
.row .pct, .row .gbp { font-family: var(--mono); font-size: 14px; text-align: right; }
.row .pct { color: var(--muted); min-width: 56px; }
.row.best .name, .row.best .gbp { color: var(--accent); }
.row.ref { grid-template-columns: 1fr auto auto; border-bottom-style: dashed; }
.row.ref .name { font-weight: 400; color: var(--muted); }
.row.ref .name small { display: block; font-size: 12px; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.hint code { font-family: var(--mono); color: var(--fg); }
.err { color: var(--warn); }

:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
</style>
</head>
<body>


<div class="wrap">
  <header>
    <h1>Rupiah Route Check</h1>
    <p class="sub">Chase cash, T212 cash and two ways to top up GoPay, past the free limits. Example rates pre-filled.</p>
  </header>

  <div class="fields">
    <label for="mid">Live interbank rate <small>(T212's rate, Rp per £)</small>
      <input id="mid" inputmode="decimal" value="24072"></label>
    <label for="chase">Chase / Mastercard rate <small>(Rp per £)</small>
      <input id="chase" inputmode="decimal" value="23900"></label>
    <label for="amt">Amount <small>(Rp)</small>
      <input id="amt" inputmode="numeric" value="3000000"></label>
  </div>

  <div class="verdict" id="verdict" aria-live="polite"></div>

  <div class="rows" id="rows"></div>

  <p class="hint" id="hint"></p>
</div>

<script>
const $ = id => document.getElementById(id);
const num = v => parseFloat(String(v).replace(/[^\d.]/g, ''));
const ids = ['mid', 'chase', 'amt'];
try { ids.forEach(k => { const v = localStorage.getItem('rrc-' + k); if (v) $(k).value = v; }); } catch (e) {}

function gbp(x) { return '£' + x.toFixed(2); }

function render() {
  const mid = num($('mid').value), chase = num($('chase').value), amt = num($('amt').value);
  try { ids.forEach(k => localStorage.setItem('rrc-' + k, $(k).value)); } catch (e) {}
  if (!(mid > 0 && chase > 0 && amt > 0)) {
    $('verdict').innerHTML = '<b class="err">Enter all three numbers</b>';
    $('rows').innerHTML = ''; $('hint').textContent = ''; return;
  }
  const base = amt / mid;
  const opts = [
    { name: 'Chase cash', pct: (1 - chase / mid) * 100, cost: amt / chase },
    { name: 'GoPay via T212', pct: 0.7, cost: base * 1.007 },
    { name: 'T212 cash', pct: 1.0, cost: base * 1.01 },
    { name: 'Indomaret top-up (Chase cash)', pct: (1 - chase / mid) * 100 + 0.15, cost: amt * 1.0015 / chase, gopay: true },
  ];
  opts[1].gopay = true;
  opts.sort((a, b) => a.cost - b.cost);
  const gp = opts.filter(o => o.gopay);
  const gpDiff = gp[1].cost - gp[0].cost;
  const [best, next] = opts;
  const diff = next.cost - best.cost;
  $('verdict').innerHTML = `<b>${best.name} wins</b><span>Saves ${gbp(diff)} vs ${next.name} on this amount${diff < 0.25 ? ' — pick whichever is convenient' : ''}</span><span style="display:block;margin-top:6px">Need GoPay balance? <b style="display:inline;font-size:inherit">${gp[0].name}</b>, saves ${gbp(gpDiff)}</span>`;
  $('rows').innerHTML = opts.map((o, i) =>
    `<div class="row${i === 0 ? ' best' : ''}"><span class="name">${o.name}</span><span class="pct">${o.pct.toFixed(2)}%</span><span class="gbp">${gbp(o.cost)}</span></div>`).join('')
    + `<div class="row ref"><span class="name">T212 cash, within free limit<small>For reference: not ranked</small></span><span class="pct">0.00%</span><span class="gbp">${gbp(base)}</span></div>`;
  const breakeven = mid / 1.007;
  const indoBreak = mid * 1.0015 / 1.007;
  $('hint').innerHTML = `Chase cash beats the T212 top-up above <code>${Math.round(breakeven).toLocaleString('en-GB')}</code>. An Indomaret top-up beats it above <code>${Math.round(indoBreak).toLocaleString('en-GB')}</code>.`;
}
ids.forEach(k => $(k).addEventListener('input', render));
render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>

</body>
</html>
